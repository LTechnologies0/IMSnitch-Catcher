name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4

      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" >> local.properties

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi

      - name: Assemble signed release APKs (all ABIs)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK signatures
        run: |
          APKSIGNER=$(find "${ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -1)
          for apk in app/build/outputs/apk/release/*-release.apk; do
            echo "Verifying $apk"
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Collect release APKs
        run: |
          mkdir -p dist/release
          VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          for apk in app/build/outputs/apk/release/*-release.apk; do
            base=$(basename "$apk")
            # app-arm64-v8a-release.apk → IMSnitchCatcher-0.1.0-arm64-v8a-release.apk
            abi=$(echo "$base" | sed -E 's/^app-([^-]+)-release\.apk$/\1/')
            if [ "$abi" = "$base" ]; then
              cp "$apk" "dist/release/IMSnitchCatcher-${VERSION}-release.apk"
            else
              cp "$apk" "dist/release/IMSnitchCatcher-${VERSION}-${abi}-release.apk"
            fi
          done
          ls -lh dist/release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: IMSnitch Catcher ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/release/*.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') || contains(github.event.inputs.tag, '-') }}
